name: CI

# Runs the full quality gate on every push to main and on every pull request,
# so a broken build, a lint error, or a failing tax-calculation test can't merge.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (Vitest)
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
